server:
  port: 5000

external:
  product-service:
    url: http://localhost:3001
  similar-ids-service:
    url: http://localhost:3001

spring:
  application:
    name: similar-products-api
  codec:
    max-in-memory-size: 10MB

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - com.carlossevilla.similar_products_api.domain.exception.ExternalServiceException
        ignoreExceptions:
          - com.carlossevilla.similar_products_api.domain.exception.ProductNotFoundException

  timelimiter:
    instances:
      productService:
        timeoutDuration: 2s
        cancelRunningFuture: true

  retry:
    instances:
      productService:
        maxAttempts: 3
        waitDuration: 100ms
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - com.carlossevilla.similar_products_api.domain.exception.ExternalServiceException

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      influx:
        enabled: true
        uri: http://localhost:8086
        db: k6
